["","Step 2: look at the data",String.raw`<p>Histogram of salary, scatter plot of experience against salary. You are looking for unusual observations, possible relationships and whether the variables make sense. You are not trying to prove anything from a graph; you are trying to understand the dataset.</p>`],
["","Step 3: target and features",String.raw`<p>Create <code>High_Salary = (df["Salary"] >= 100000)</code> and check <code>value_counts(normalize=True)</code>: if 95% of employees are below $100K, a model predicting “below” every time would have high accuracy and be practically useless. Then choose the features that would plausibly exist at prediction time. The lesson from <a href="#day-25">Day 25</a>: <b>do not include Salary</b> in the features, since it directly defines the target.</p>`],
["","Step 4: split first, then build the pipeline",String.raw`<p>Split <i>before</i> fitting any preprocessing so information from the test set cannot influence training. Separate numeric and categorical features, impute the numeric ones with the median, impute the categorical ones with the most frequent value, encode with <code>OneHotEncoder(handle_unknown="ignore")</code> and combine everything with a <code>ColumnTransformer</code>. Notice how much work the pipeline is taking care of.</p>`],
["","Step 5: a baseline model, then another",String.raw`<p>Start simple with a logistic regression pipeline and evaluate with more than accuracy: you have learned better. It is a baseline, something to compare against; you do not need to start with the fanciest model. Then try a <code>RandomForestClassifier(n_estimators=200)</code> pipeline with the same metrics.</p>`],
["key","Don’t just pick the bigger number",String.raw`<p>If one model scores higher, do not immediately declare it better. Ask: what metric matters? Is the difference meaningful? How stable is the result? Was the model selected using the test set? Does it generalize? This is one of the biggest lessons of the series.</p>`],
["","Step 6: cross-validate, tune, test once",String.raw`<p>Use <code>cross_val_score(..., scoring="roc_auc")</code> on the training data for both pipelines, looking at the means and the standard deviations, so you are not relying on one lucky split. Tune the forest with <code>GridSearchCV</code> and read <code>best_params_</code> and <code>best_score_</code>. Only then use <code>grid_search.best_estimator_</code> on the test set, the moment you have protected since the beginning: the final evaluation of the model-selection process. Hyperparameters were not chosen using the test set.</p>`],
["","Step 7: understand the errors and the model",String.raw`<p>Build the confusion matrix (actual 0: TN, FP; actual 1: FN, TP) and ask whether the model produces many false positives or misses many high earners; which matters depends on your goal. Inspect feature importance with <code>get_feature_names_out()</code> and <code>feature_importances_</code>, remembering that it describes how the model uses variables, not what causes salary.</p>`],
["","Step 8: save it and wrap it in an app",String.raw`<p>Save the trained pipeline as <code>salary_model.joblib</code>, the model artifact, and build the Streamlit app from <a href="#day-29">Day 29</a>: collect the inputs, build <code>input_data</code>, and call <code>predict</code> and <code>predict_proba</code> on the saved pipeline.</p>`],
["ai","Where each step came from",String.raw`<p>Exploration and histograms (<a href="#day-1">Day 1</a>), targets and classification (<a href="#day-13">Day 13</a>), pipelines (<a href="#day-16">Days 16</a> and <a href="#day-26">26</a>), tuning (<a href="#day-17">Day 17</a>), choosing a metric (<a href="#day-18">Day 18</a>), forests (<a href="#day-20">Day 20</a>), interpretation (<a href="#day-22">Day 22</a>), data quality (<a href="#day-23">Days 23</a> and <a href="#day-24">24</a>), leakage (<a href="#day-25">Day 25</a>), reliable evaluation (<a href="#day-27">Day 27</a>) and saving the model (<a href="#day-28">Day 28</a>). The Day 30 Coding Lab runs a compact version of this workflow.</p>`],
["","What you still don’t know",String.raw`<p>Do not pretend you suddenly know everything. Still unexplored: time-series forecasting, dimensionality reduction, neural networks, natural language processing, computer vision, causal inference, experiment design, cloud deployment and large-scale data engineering, and even what you learned needs more practice. The goal was not to become a data scientist in 30 episodes; it was to build a foundation.</p>`],
["key","What the mistakes taught",String.raw`<p>Some of the most useful lessons were the mistakes. More variables ≠ automatically a better model. Higher training performance ≠ better generalization. Higher accuracy ≠ automatically a better model. Feature importance ≠ causation. A complicated model ≠ automatically a better model. A prediction ≠ truth. A clean-looking notebook ≠ a reliable data product. Those distinctions are probably more valuable than memorizing another algorithm.</p>`],
["","The biggest lesson and what comes next",String.raw`<p>Data science is not just choosing an algorithm; it is the entire process: understand the data, ask a useful question, define the target correctly, avoid leakage, preprocess correctly, evaluate appropriately, understand the limitations and, if someone is going to use it, build a reliable way to make predictions. This is the end of Season 1, which taught the basic machine-learning workflow through one project. The next project will start with a new problem such as sales forecasting, beginning with the business question rather than the algorithm: how do you turn a real-world problem into a data science problem? The point isn’t to know everything; it is to keep building.</p>`]]
};

{t:"Concept",q:"A scatter plot shows salary tends to rise with experience. What can you conclude?",o:["They are associated, but the plot alone does not show that experience causes higher pay","Experience causes higher pay","Salary is exactly determined by experience"],e:"A graph shows a relationship, not a cause. No model has been built yet."},
{t:"Code",q:"Typing <code>df[\"experiance\"]</code> when the column is called “experience” produces…",o:["A KeyError, because that column name does not exist","A SyntaxError because of the quotes","An empty column"],e:"pandas raises a KeyError for a missing column. Reading the message and fixing the typo is part of learning."},
{t:"Concept",q:"Which <code>describe()</code> statistic tells you how spread out the values are around the mean?",o:["The standard deviation (std)","The count","The maximum"],e:"The standard deviation measures spread around the mean; count is the number of non-missing values and max is the largest value."}],
2:[{t:"Maths",q:"In Y = β₀ + β₁X + ε, what does β₁ represent?",o:["The change in predicted salary for one additional year of experience","The predicted salary at zero years of experience","The random error term"],e:"β₁ is the coefficient on X (experience). β₀ is the intercept and ε the error."},
{t:"Code",q:"Why is X written <code>df[[\"Years of Experience\"]]</code> with double brackets?",o:["scikit-learn expects a 2-D table of features","It sorts the column","It removes missing values"],e:"Double brackets return a one-column DataFrame (2-D); single brackets return a 1-D Series."},
{t:"Concept",q:"<code>model.fit</code> fails with an error about NaN values. What is the most likely cause?",o:["Missing values in the experience or salary column","The model is too simple","Experience values are negative"],e:"Check with <code>isna().sum()</code>; the lesson removes incomplete rows with <code>dropna()</code>."},
{t:"Concept",q:"A model has a high R². What does that tell you?",o:["It explains much of the variation in the data it was evaluated on, but not that it is causal or good on new data","That experience causes salary","That predictions are within $1 of the truth"],e:"R² describes variation explained. It does not prove causation, and in-sample R² says little about unseen data."}],
3:[{t:"Concept",q:"In a model with experience and age, the experience coefficient is read as…",o:["The estimated change in salary for one more year of experience, holding age constant","The change in salary ignoring age","The correlation between experience and age"],e:"“Holding the other variables constant” is the key to interpreting multiple regression."},
{t:"Maths",q:"Which equation is a multiple regression with two predictors?",o:["Y = β₀ + β₁X₁ + β₂X₂ + ε","Y = β₀ + β₁X + ε","Y = β₀ + X₁X₂"],e:"Each predictor gets its own coefficient."},
{t:"Concept",q:"R² rises when a second variable is added. Is that proof the variable truly helps?",o:["No: in-sample R² cannot fall when a variable is added, so check on unseen data","Yes, always","Only when the variable is categorical"],e:"For least squares with an intercept fitted to the same data, R² never decreases when a variable is added."},
{t:"Concept",q:"Why did adding Education Level make <code>fit()</code> fail?",o:["The model expects numbers and the column contained text","Education is unrelated to salary","Regression allows only two variables"],e:"Categorical text must be converted into numeric form, which Day 4 covers with dummy variables."}],
4:[{t:"Concept",q:"Why is coding Bachelor’s = 1, Master’s = 2, PhD = 3 a poor idea?",o:["It tells the model the steps between categories are equal and numeric","Numbers are slower to process","pandas cannot store them"],e:"The numbers would carry an ordering and spacing you may not intend."},
{t:"Code",q:"What does <code>drop_first=True</code> do in <code>pd.get_dummies</code>?",o:["Leaves out one category, which becomes the reference category","Drops the first row of data","Sorts the categories"],e:"One category must be omitted to avoid redundancy; the omitted one is the reference."},
{t:"Concept",q:"With Bachelor’s as the reference, a Master’s coefficient of +8,000 means…",o:["Predicted salary is about $8,000 higher than for Bachelor’s, holding other variables constant","A master’s degree causes an $8,000 raise","8,000 people hold a master’s degree"],e:"Coefficients are read relative to the reference category and describe association within the model, not cause."},
{t:"Maths",q:"With an intercept, what goes wrong if you create a dummy for <i>every</i> category?",o:["The dummies sum to 1 in every row, duplicating the intercept (perfect redundancy)","The model becomes nonlinear","R² becomes zero"],e:"This is the dummy variable trap, a form of perfect multicollinearity."}],
5:[{t:"Maths",q:"In Salary = β₀ + β₁·Exp + β₂·Exp² + ε, why is it still called linear regression?",o:["It is linear in the coefficients β","Exp² is a straight line","It has no error term"],e:"The model is a weighted sum of columns, so <code>LinearRegression</code> can fit it once the squared column exists."},
{t:"Code",q:"Which line creates the squared term?",o:["df[\"Years of Experience\"] ** 2","df[\"Years of Experience\"] ^ 2","df[\"Years of Experience\"] * 2"],e:"<code>**</code> is exponentiation in Python; <code>^</code> is bitwise XOR, and <code>* 2</code> merely doubles."},
{t:"Concept",q:"If you keep adding higher powers until the curve follows the sample very closely, which risk grows?",o:["Overfitting: learning noise instead of a pattern that generalizes","Underfitting","Missing values"],e:"A more flexible model is not automatically better; Day 6 tests this on unseen data."},
{t:"Concept",q:"To draw the fitted quadratic curve smoothly you should…",o:["Predict on an evenly spaced grid (such as np.linspace) over the experience range","Plot the predictions in the order the rows appear","Use only the first ten rows"],e:"An ordered grid gives a smooth curve regardless of row order."}],
6:[{t:"Concept",q:"Training R² is 0.95 and test R² is 0.40. What does this suggest?",o:["Overfitting: the model learned the training data too specifically","Underfitting","A perfect model"],e:"A large drop from training to test performance is a warning sign of overfitting."},
{t:"Code",q:"What does <code>random_state=42</code> do in <code>train_test_split</code>?",o:["Makes the random split reproducible","Uses 42% of the data for testing","Selects 42 features"],e:"Without it the split would differ each time you run the notebook."},
{t:"Concept",q:"While tweaking a model you check the test score after every change. What is the problem?",o:["The test set stops being unseen as you tune to it; use validation data or cross-validation instead","Nothing, that is the purpose of the test set","Test sets can only be used twice"],e:"Repeated checking turns the test set into a tuning tool."},
{t:"Maths",q:"With <code>test_size=0.2</code> on 1,000 rows, how many rows are in the training set?",o:["800","200","20"],e:"20% (200 rows) go to testing, leaving 800 for training."}],
7:[{t:"Maths",q:"Actual salary is 65,000 and predicted is 70,000. What is the error (Actual − Predicted)?",o:["−5,000, an overprediction","+5,000, an overprediction","−5,000, an underprediction"],e:"65,000 − 70,000 = −5,000. A negative residual means the model predicted too high."},
{t:"Maths",q:"The absolute errors are 5,000, 3,000, 2,000 and 4,000. What is the MAE?",o:["3,500","14,000","4,000"],e:"(5,000 + 3,000 + 2,000 + 4,000) ÷ 4 = 3,500."},
{t:"Concept",q:"Why does RMSE penalize large errors more than MAE does?",o:["Errors are squared before they are averaged","It ignores small errors","It uses the median"],e:"An error five times larger contributes 25 times as much to the squared total."},
{t:"Code",q:"Which expression turns an MSE value <code>mse</code> into RMSE?",o:["np.sqrt(mse)","mse ** 2","np.abs(mse)"],e:"RMSE is the square root of MSE, returning to the original units."}],
8:[{t:"Concept",q:"Age and years of experience are strongly related. This problem is called…",o:["Multicollinearity","Overfitting","Data leakage"],e:"When predictors are strongly related, individual coefficient estimates become harder to interpret."},
{t:"Code",q:"Which line selects experience and age as the feature matrix?",o:["X = df[[\"Years of Experience\", \"Age\"]]","X = df[\"Years of Experience\", \"Age\"]","X = df[[\"Salary\"]]"],e:"Pass a list of column names inside double brackets."},
{t:"Concept",q:"The multi-variable model has higher test R² and lower test MAE and RMSE than the baseline. A reasonable conclusion?",o:["The extra variable helped on this test set, but more variables are not automatically better","Always add more variables","The baseline must be wrong"],e:"Evidence on unseen data supports the improvement, but adding variables can also bring noise and multicollinearity."},
{t:"Concept",q:"Why compare the models using the same train/test split?",o:["So differences come from the models and not from different data","To save memory","So R² is always higher"],e:"Different splits would add random differences to the comparison."}],
9:[{t:"Concept",q:"Why can one-hot encoding every job title be a problem?",o:["It creates hundreds of sparse columns, many with very few observations","It deletes rows","It removes the target"],e:"Too many columns relative to the data makes the model large and hard to estimate."},
{t:"Code",q:"What does <code>series.where(series.map(counts) &gt;= threshold, \"Other\")</code> do?",o:["Keeps titles with at least threshold rows and relabels the rest as “Other”","Deletes the rare titles","Counts the rare titles"],e:"<code>where</code> keeps values where the condition is True and replaces the others."},
{t:"Concept",q:"Deciding which titles are rare using the whole dataset before splitting risks…",o:["Data leakage: test-set information influences preprocessing","Underfitting","Missing values"],e:"A rigorous workflow learns such thresholds from the training data only."},
{t:"Concept",q:"What is the trade-off of grouping rare categories into “Other”?",o:["You lose detail and different jobs share a category, but gain stability","There is no trade-off","You gain detail and lose rows"],e:"It is a modeling choice, not automatically correct."}],
10:[{t:"Maths",q:"Ridge regression adds a penalty based on…",o:["The squared size of the coefficients","The number of rows","The test error"],e:"Lasso uses absolute values instead of squares."},
{t:"Concept",q:"Why standardize the features before Ridge or Lasso?",o:["The penalty depends on scale, so variables in years and dollars would be penalized unequally","Ridge only accepts values between 0 and 1","It removes outliers"],e:"Standardizing puts predictors on a comparable scale so the penalty treats them fairly."},
{t:"Code",q:"<code>RidgeCV(alphas=[0.01, 0.1, 1, 10])</code> chooses alpha using…",o:["Cross-validation on the training data","The test set","Random guessing"],e:"The final test set stays untouched until the end."},
{t:"Concept",q:"Why is choosing the alpha with the best test score a mistake?",o:["It uses the test set to tune the model, so it is no longer a truly unseen final check","alpha cannot be changed","The test set is too large"],e:"Hyperparameters should be chosen with cross-validation on the training data."}],
11:[{t:"Concept",q:"A residual plot shows a clear curve instead of a random scatter around zero. What does it suggest?",o:["The straight line may not capture the relationship (functional form)","The data are perfectly linear","There are no outliers"],e:"A pattern in the residuals means something systematic is missing, such as a squared term."},
{t:"Concept",q:"An employee has 40 years of experience when most others have 2 to 6. This observation has…",o:["High leverage, because its predictor value is unusual","A negative residual","A missing value"],e:"Leverage is about unusual predictor values; if the point also changes the fitted line a lot, it is influential."},
{t:"Concept",q:"What is the best response to one very high salary?",o:["Investigate whether it is an error or legitimate, then run a sensitivity check","Delete it immediately","Replace it with the mean"],e:"Unusual does not mean wrong. Deleting inconvenient data can make the analysis less representative."},
{t:"Code",q:"What does <code>df[df['Salary'] &lt;= df['Salary'].quantile(0.99)]</code> do?",o:["Keeps all rows except the top 1% of salaries, as a sensitivity check","Keeps only the top 1% of salaries","Deletes duplicate rows"],e:"It shows how sensitive the model is to extreme values; it does not claim those observations were wrong."}],
12:[{t:"Concept",q:"Changing <code>random_state</code> from 42 to 123 gives a different test RMSE. Why?",o:["A different random split puts different observations in the training and test sets","The model changed","The algorithm is broken"],e:"The model is the same; the data used to train and test it differs. That is the problem cross-validation addresses."},
{t:"Maths",q:"In 5-fold cross-validation with 100 observations, how many observations are in each validation fold?",o:["20","5","80"],e:"100 ÷ 5 = 20 validate while the other 80 train."},
{t:"Concept",q:"Do you still need a separate test set when you use cross-validation?",o:["Yes: cross-validate inside the training data and keep the test set for the final evaluation","No, cross-validation replaces it","Only for classification"],e:"Cross-validation guides selection; the untouched test set gives the final estimate."},
{t:"Code",q:"<code>cross_val_score(..., scoring=\"neg_root_mean_squared_error\")</code> returns negative values. How do you get ordinary RMSE values?",o:["Negate them: <code>-scores</code>","Square them","Take their logarithm"],e:"scikit-learn maximizes scores, so error metrics are reported negated."}],
13:[{t:"Code",q:"What does <code>model.predict_proba(X_test)[:, 1]</code> return?",o:["The probability of the positive class (class 1) for each test row","The predicted class labels","The accuracy"],e:"<code>predict_proba</code> has one column per class; column 1 is the probability of class 1."},
{t:"Concept",q:"Why can accuracy mislead when 90% of employees earn below $100K?",o:["Predicting “below” for everyone gives 90% accuracy yet finds no high earners","Accuracy cannot be computed","Precision would be 1"],e:"Accuracy hides which mistakes are being made, so look at the confusion matrix, precision and recall."},
{t:"Concept",q:"In the confusion matrix, a false negative here is…",o:["A high earner the model predicted as below $100K","A low earner the model predicted as high","A correctly predicted low earner"],e:"A false negative is an actual positive that the model missed."},
{t:"Maths",q:"TP = 40, FP = 10 and FN = 20. What is the precision?",o:["0.80","0.67","0.50"],e:"Precision = TP ÷ (TP + FP) = 40 ÷ 50 = 0.80. (Recall would be 40 ÷ 60 ≈ 0.67.)"}],
14:[{t:"Maths",q:"At a threshold of 0.7, a predicted probability of 0.65 is classified as…",o:["Class 0, because it is below the threshold","Class 1","Undefined"],e:"The rule is probability ≥ threshold gives class 1."},
{t:"Concept",q:"Does choosing a different threshold retrain the model?",o:["No: it only changes how the same probabilities are turned into classes","Yes, from scratch","Only for logistic regression"],e:"One fitted model, many possible thresholds."},
{t:"Concept",q:"What does an AUC near 0.5 indicate?",o:["Ranking ability no better than random","A perfect model","100% accuracy"],e:"AUC near 1 means strong separation; 0.5 is what random ranking would give."},
{t:"Concept",q:"Which quantities are on the axes of the ROC curve?",o:["False positive rate (x) and true positive rate (y)","Precision (x) and F1 (y)","Accuracy (x) and loss (y)"],e:"Each point on the curve is a different threshold."}],
15:[{t:"Concept",q:"Why use <code>LogisticRegression(max_iter=1000)</code> with many one-hot features?",o:["The optimizer may need more iterations to converge","To build 1,000 trees","To obtain 1,000 coefficients"],e:"Logistic regression is fitted iteratively; more features can need more iterations."},
{t:"Concept",q:"A positive coefficient on <code>Job Title_Manager</code> (reference: Analyst) means most precisely…",o:["Higher log-odds of a high salary than the reference title, holding other variables constant","Becoming a manager causes a raise","Managers always earn over $100K"],e:"Coefficients describe association relative to the reference category, not causation."},
{t:"Maths",q:"A logistic regression coefficient is 0.69. Roughly what odds ratio is that?",o:["About 2: the odds double","About 0.69","About 0.5"],e:"The odds ratio is e<sup>β</sup>, and e<sup>0.69</sup> ≈ 2."},
{t:"Concept",q:"Choosing the 20 most common titles using the whole dataset before splitting is…",o:["A mild form of data leakage; such steps should be learned from training data, for example in a pipeline","Required for logistic regression","Impossible in pandas"],e:"The test set should not influence preprocessing decisions."}],
16:[{t:"Code",q:"What does <code>handle_unknown=\"ignore\"</code> do in <code>OneHotEncoder</code>?",o:["Lets the encoder handle categories not seen in training instead of raising an error","Ignores all categorical columns","Drops rows with unknown values"],e:"An unseen category is encoded as all zeros."},
{t:"Concept",q:"What does <code>ColumnTransformer</code> do?",o:["Applies different preprocessing steps to different columns","Chooses the best model","Splits the data"],e:"For example, scaling the numeric columns and one-hot encoding the categorical ones."},
{t:"Concept",q:"Which workflow avoids leakage?",o:["Split first, learn preprocessing on the training data, apply it to both sets","Fit the scaler on the whole dataset, then split","Run <code>get_dummies</code> on all data, then split"],e:"Preprocessing before the split lets test information influence training."},
{t:"Maths",q:"After standardizing with z = (x − μ) ÷ σ, what are the variable’s mean and standard deviation?",o:["Mean 0 and standard deviation 1","Mean 1 and standard deviation 0","Mean 0 and standard deviation 0"],e:"Each value becomes its distance from the mean in units of the standard deviation."}],
17:[{t:"Concept",q:"Which of these is a hyperparameter?",o:["C in <code>LogisticRegression(C=1)</code>","The fitted coefficient of experience","The intercept"],e:"Hyperparameters are set before training; coefficients and the intercept are learned from the data."},
{t:"Code",q:"In <code>{\"classifier__C\": [0.01, 0.1, 1]}</code>, what does the double underscore mean?",o:["The parameter C of the pipeline step named “classifier”","C squared","A private variable"],e:"The pattern is <code>step_name__parameter_name</code>."},
{t:"Concept",q:"GridSearchCV reports best C = 10. What should you conclude?",o:["It was the best of the values tried, on this data, split and metric","10 is the universally best value","Larger C is always better"],e:"Tuning searches the options you provide; it does not discover a universal truth."},
{t:"Maths",q:"With 5 values of C, 2 solvers and 5-fold cross-validation, about how many fits does the search run (ignoring the final refit)?",o:["50","10","25"],e:"5 × 2 × 5 = 50, which is why big grids get expensive."}],
18:[{t:"Concept",q:"You are detecting a serious disease and missing a case is costly. Which metric gains importance?",o:["Recall","Precision","Accuracy alone"],e:"Recall asks how many actual positives were found."},
{t:"Concept",q:"Every positive prediction triggers an expensive investigation. Which metric gains importance?",o:["Precision","Recall","R²"],e:"Precision asks how often a positive prediction is correct, so it limits wasted investigations."},
{t:"Concept",q:"Why is “accuracy is 0.90 and recall is 0.70, so the model is best at accuracy” meaningless?",o:["The metrics measure different things, like comparing kilometers with kilograms","Accuracy is always larger","Recall cannot exceed accuracy"],e:"Choose the metric that reflects your goal, then compare models on it."},
{t:"Code",q:"Which change makes <code>GridSearchCV</code> optimize recall instead of AUC?",o:["<code>scoring=\"recall\"</code>","<code>cv=\"recall\"</code>","<code>param_grid=\"recall\"</code>"],e:"The <code>scoring</code> argument defines what “best” means."}],
19:[{t:"Concept",q:"A tree has 100% training accuracy but 70% test accuracy. What happened?",o:["It overfit: it learned the training data too specifically","It underfit","The test set is wrong"],e:"Unrestricted trees can keep splitting until they nearly memorize the training data."},
{t:"Code",q:"Which argument limits how deep a decision tree can grow?",o:["<code>max_depth</code>","<code>n_estimators</code>","<code>learning_rate</code>"],e:"<code>n_estimators</code> and <code>learning_rate</code> belong to ensembles."},
{t:"Concept",q:"Do decision trees need <code>StandardScaler</code>?",o:["Usually not: they split on thresholds, so feature scale does not matter","Always","Only for categorical variables"],e:"Multiplying a numeric feature by a constant does not change the ordering of observations."},
{t:"Concept",q:"Does a decision tree need text categories to be encoded?",o:["Yes, categories still need converting, for example with one-hot encoding","No, trees read text directly","Only inside random forests"],e:"scikit-learn trees need numeric input, so categorical variables still go through an encoder."}],
20:[{t:"Concept",q:"Why are the trees in a random forest deliberately different from each other?",o:["They use different samples of rows and subsets of features, so their mistakes are less correlated","To make training slower","Because depth varies randomly"],e:"If every tree made the same mistakes, hundreds of trees would not help."},
{t:"Code",q:"Which attribute holds a fitted forest’s built-in feature importances?",o:["<code>feature_importances_</code>","<code>coef_</code>","<code>best_params_</code>"],e:"After one-hot encoding, get the column names from <code>get_feature_names_out()</code>."},
{t:"Concept",q:"A feature has high importance in the forest. What can you say?",o:["The forest relied on it heavily for prediction, which is not evidence that it causes salary","It causes higher salary","It is the only useful feature"],e:"Feature importance describes the model’s prediction process, not causes."},
{t:"Concept",q:"What typically happens to test AUC as <code>n_estimators</code> keeps increasing?",o:["Gains level off (diminishing returns) while computation grows","It always rises","It always falls"],e:"More trees is not automatically better."}],
21:[{t:"Concept",q:"How does Random Forest differ from Gradient Boosting?",o:["A forest builds trees largely independently; boosting builds them sequentially, each improving the current model","A forest uses one tree and boosting uses many","Boosting has no hyperparameters"],e:"Independent and diverse versus sequential and corrective."},
{t:"Concept",q:"What does <code>learning_rate</code> control in gradient boosting?",o:["How much of each new tree’s correction is added to the model","How fast the code runs","How many rows are used"],e:"A high rate learns aggressively from each tree; a low rate learns cautiously, and it interacts with the number of trees."},
{t:"Maths",q:"In F<sub>m</sub> = F<sub>m−1</sub> + η·h<sub>m</sub>, what is h<sub>m</sub>?",o:["The new small tree fitted to the current model’s errors","The learning rate","The final prediction"],e:"η is the learning rate and F<sub>m−1</sub> is the current model."},
{t:"Concept",q:"Do standard gradient boosting classifiers usually need feature scaling?",o:["Usually not, because they are built from trees that split on thresholds","Always","Only for categorical features"],e:"Multiplying a numeric feature by a constant does not change the ordering of observations."}],
22:[{t:"Concept",q:"How does permutation importance work?",o:["Shuffle one feature’s values and measure how much performance drops","Permanently delete the feature","Count how often the feature name appears"],e:"A large drop means the model relied on that feature; almost no drop means it did not."},
{t:"Concept",q:"What does a SHAP waterfall plot explain?",o:["How each feature pushed one particular prediction up or down from a baseline","The model’s overall accuracy","Which rows are duplicates"],e:"It is a local explanation of a single prediction."},
{t:"Concept",q:"Which of these is a <i>local</i> explanation?",o:["Why this particular employee received an 82% probability","Which features the model generally relies on","The model’s AUC"],e:"Global explanations describe overall behavior; local ones explain one prediction."},
{t:"Concept",q:"Built-in importance and permutation importance disagree. What is the sensible reaction?",o:["They ask different questions, so compare several methods instead of trusting one","One must be a bug","Discard the model"],e:"Interpretation methods have limitations, and none is the final truth."}],
23:[{t:"Code",q:"Which expression counts the missing values in each column?",o:["<code>df.isna().sum()</code>","<code>df.isna.sum()</code>","<code>df.dropna().sum()</code>"],e:"<code>isna</code> is a method, so it needs parentheses."},
{t:"Concept",q:"Two rows in the data are identical. What should you do first?",o:["Investigate: two different employees can genuinely have identical values","Delete one automatically","Ignore it"],e:"You need to know what defines a unique observation. Duplicate-looking rows are not necessarily duplicate records."},
{t:"Concept",q:"Why do “Engineer”, “engineer” and “Engineer ” (trailing space) matter for <code>OneHotEncoder</code>?",o:["Each different spelling becomes its own category","OneHotEncoder merges them automatically","Only capitalization matters"],e:"Inconsistent text creates extra, sparse categories; standardize only when you understand the values."},
{t:"Concept",q:"Years of experience is larger than age in some rows. This is an example of…",o:["A suspicious combination of variables that needs checking","A normal outlier","A missing value"],e:"Data cleaning includes checking whether relationships between variables make sense."}],
24:[{t:"Concept",q:"Why is median imputation often preferred to mean imputation for a skewed variable?",o:["The median is more resistant to extreme values","The median is always correct","The mean cannot be calculated"],e:"A single very high value pulls the mean upward."},
{t:"Code",q:"Which <code>SimpleImputer</code> strategy suits categorical columns?",o:["<code>most_frequent</code>","<code>median</code>","<code>mean</code>"],e:"You cannot calculate a mean education level; the mode (most frequent value) or a constant such as “Unknown” works."},
{t:"Concept",q:"What is a weakness of simple imputation when there are thousands of gaps?",o:["Many identical filled values can make the variable look less variable than it really is","It always increases variance","It deletes rows"],e:"Simple imputation can make the data look more certain than it is."},
{t:"Concept",q:"Why use <code>SimpleImputer</code> inside a pipeline rather than <code>fillna</code> on the whole dataset?",o:["The fill value is learned from training data only, which avoids leakage","<code>fillna</code> is slower","<code>SimpleImputer</code> fixes outliers"],e:"Computing the median before splitting uses the test rows too."}],
25:[{t:"Concept",q:"You predict <code>High_Salary = Salary &gt;= 100000</code> and leave Salary in the features. This is…",o:["Target leakage: the model effectively has the answer","Good feature engineering","Overfitting only"],e:"The feature directly defines the target, so the score will look impressive but mean nothing."},
{t:"Concept",q:"To predict whether an employee will leave, you use an exit-interview score recorded after they leave. What is wrong?",o:["Temporal leakage: that information would not exist at prediction time","Nothing","It is missing data"],e:"A model may only use information available before the prediction point."},
{t:"Concept",q:"How is leakage different from overfitting?",o:["Leakage contaminates the evaluation with information the model should not see; overfitting is learning the training data too closely","They are the same thing","Overfitting only happens with trees"],e:"Leakage can make overfitting harder to notice because the evaluation itself is contaminated."},
{t:"Code",q:"Which approach avoids leakage between cross-validation folds?",o:["Pass the whole pipeline to <code>cross_val_score</code>, so preprocessing is refitted inside each training fold","Preprocess the whole dataset first","Neither approach matters"],e:"Preprocessing the whole dataset first lets validation folds influence the preprocessing."}],
26:[{t:"Concept",q:"Why is Salary left out of the pipeline’s features?",o:["It directly determines the target, so including it would be leakage","Pipelines cannot use numeric columns","Salary has too many values"],e:"A pipeline does not decide whether the workflow makes sense; that is still your job."},
{t:"Code",q:"What does <code>pipeline.fit(X_train, y_train)</code> do?",o:["Learns the preprocessing parameters from the training data and fits the model","Evaluates on the test set","Saves the model to disk"],e:"<code>predict</code> then applies the learned preprocessing to raw test data automatically."},
{t:"Concept",q:"Does putting a flawed decision inside a pipeline make it correct?",o:["No: a pipeline makes decisions reproducible, not correct","Yes","Only for logistic regression"],e:"Leaving Salary in the features is still leakage inside a pipeline."},
{t:"Concept",q:"Which model typically benefits from scaling the numeric variables?",o:["Logistic regression","Random forest","Decision tree"],e:"Tree-based models usually do not need scaling."}],
27:[{t:"Concept",q:"What is the main purpose of cross-validation in this workflow?",o:["To compare models and settings using the training data","To replace the test set","To increase the amount of training data"],e:"The test set stays untouched until the final evaluation."},
{t:"Concept",q:"Why report the standard deviation of the cross-validation scores as well as the mean?",o:["It shows how much performance varies across folds","It proves the model is good","It removes noise"],e:"Close scores across folds suggest stable performance; widely varying scores do not."},
{t:"Concept",q:"Mean CV AUC is 0.86 but the final test AUC is 0.83. What should you conclude?",o:["No automatic problem: estimates vary; worry only about a large, unexpected gap","The model is broken","The test set must be wrong"],e:"The test set is another sample, so estimates naturally differ."},
{t:"Concept",q:"Why can model selection itself overfit?",o:["Compare enough models or settings and one will look good by chance","Cross-validation is invalid","The test set is too big"],e:"That is why a final untouched test is needed."}],

{t:"Concept",q:"When predicting for a new employee, what should <code>new_employee</code> contain?",o:["Only the feature columns, with no target and no Salary","The Salary as well","The target"],e:"You provide only information that would be available when making the prediction."},

{t:"Concept",q:"A predicted probability of 0.72 most precisely means…",o:["The model estimates 0.72 for the high-salary class (calibration is a separate question)","72% of similar people earn over $100K","The model is 72% accurate"],e:"The output of a fitted model is not automatically a calibrated real-world frequency."}],

{t:"Code",q:"What must the DataFrame built from user input match exactly?",o:["The column names and structure the model was trained on","The browser’s font","The app’s title"],e:"The application must give the model the same kind of input structure it saw in training."},
