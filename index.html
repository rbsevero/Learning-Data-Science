["","Keep the most common titles",String.raw`<p>A simple strategy: find the 20 most frequent job titles, then build <code>df["Job Title Clean"] = df["Job Title"].where(df["Job Title"].isin(top_jobs), "Other")</code>. Check with <code>value_counts()</code>. Instead of hundreds of categories you now have a much smaller set.</p>`],
["key","A warning about leakage",String.raw`<p>In a real workflow you should not compute the top categories on the whole dataset before splitting, because information from the test set could influence preprocessing. That is a form of data leakage. For this episode the example stays simple; later, a proper pipeline learns these transformations from the training data only.</p>`],
["","Target, encoding and features",String.raw`<p>Use the same target as Day 13 (<code>High_Salary</code>, 1 for salary at least $100,000). Encode with <code>pd.get_dummies(df, columns=["Job Title Clean"], drop_first=True)</code>, collect the dummy columns by their name prefix, and build <code>X</code> from Years of Experience plus those columns. Split as before, with <code>stratify=y</code>.</p>`],
["","Why max_iter=1000?",String.raw`<p>Logistic regression uses an iterative optimization procedure. With more features the default number of iterations may not be enough for the model to converge, so <code>LogisticRegression(max_iter=1000)</code> gives it more room to finish.</p>`],
["","Evaluate and compare with the simple model",String.raw`<p>Calculate accuracy, precision, recall, F1 and AUC (from <code>predict_proba(X_test)[:, 1]</code>). Then rebuild the simple model with experience only and compare AUCs. Be careful: a small difference does not automatically mean job title is useless, and a large one does not mean you have built a perfect model. Consider how the model was evaluated and whether the improvement generalizes.</p>`],
["","A new problem: many coefficients",String.raw`<p>Look at the sorted coefficients (<code>pd.Series(model.coef_[0], index=X.columns)</code>). Each category gets its own coefficient, which is much harder to interpret than the simple models at the start of the series. A model can be useful for prediction even when individual coefficients are not easy to explain, which is one more reason not to throw every variable in automatically.</p>`],
["key","The reference category and log-odds",String.raw`<p>With an intercept, a dummy for every category would create redundant information, so <code>drop_first=True</code> omits one category, the reference. A coefficient such as <code>Job Title Clean_Manager</code> is <i>not</i> “being a manager increases salary by X”. It describes the difference in the model’s <b>log-odds</b> of the positive class relative to the reference job title, holding the other variables constant.</p>`],
["ai","Log-odds and odds ratios",String.raw`$$\log\frac{p}{1-p}=\beta_0+\beta_1x_1+\cdots,\qquad e^{\beta_j}=\text{odds ratio}$$<p>Exponentiating a coefficient gives how the <i>odds</i> of the positive class are multiplied relative to the reference, as computed in the Day 15 Coding Lab.</p>`],
["key","Prediction is not causation",String.raw`<p>“This job title has a positive coefficient, therefore it causes people to earn more” is a mistake. This is observational data: the model finds an association that helps prediction. Other factors such as experience, industry, location, seniority and education could be involved, and some are not even in the dataset.</p>`],
["","Something else to dislike, and what comes next",String.raw`<p>Taking the top 20 titles from the whole dataset before splitting is convenient but not clean. The better way is for preprocessing to be learned from training data, which is what <code>ColumnTransformer</code> and <code>Pipeline</code> do. Preprocessing is part of the machine-learning workflow: do it wrongly and you can leak test information into training, and with many categorical variables manual handling gets messy fast. That is Day 16.</p>`]],
16:[
["","The problem: messy manual preprocessing",String.raw`<p>The code has become a chain of manual steps: clean the categories, encode them, select columns, split, train, evaluate. That is error-prone and can dangerously use test information while preparing training data. The goal: give Python the raw columns, say what to do with each type of variable, and let the pipeline handle the rest.</p>`],
["","Start from the raw data and split first",String.raw`<p>Reload the original CSV, create <code>High_Salary</code>, and keep the categorical variables as <i>text</i> with no <code>get_dummies()</code>. Then split <b>before</b> any preprocessing, using <code>stratify=y</code>. The test set should represent unseen data, so the sequence is: split, learn preprocessing from the training data, train the model on training data, evaluate on test data.</p>`],
["","Numeric and categorical columns",String.raw`<p>Tell Python explicitly: <code>numeric_features = ["Years of Experience"]</code> and <code>categorical_features = ["Education Level", "Job Title"]</code>.</p>`],
["","What a ColumnTransformer does",String.raw`<p>It applies different preprocessing to different columns. Categorical columns go through <code>OneHotEncoder(handle_unknown="ignore")</code>; numeric columns use <code>"passthrough"</code>, meaning “don’t transform these, just pass them through”. <code>handle_unknown="ignore"</code> matters when the test data contains a job title that was not in the training data: the encoder handles the unseen category instead of crashing.</p>`],
["ai","What an unseen category becomes",String.raw`<p>With <code>handle_unknown="ignore"</code> an unseen category is encoded as all zeros in that variable’s one-hot columns, so the model effectively treats it as having none of the known categories.</p>`],
["","Build and train the pipeline",String.raw`<p><code>Pipeline([("preprocessor", preprocessor), ("classifier", LogisticRegression(max_iter=1000))])</code> connects preprocessing and the model. One call, <code>model_pipeline.fit(X_train, y_train)</code>, does everything; no manual dummy columns. Use <code>predict</code> and <code>predict_proba(X_test)[:, 1]</code> as with any model: the pipeline automatically applies the same preprocessing to the test data. Evaluate with accuracy, precision, recall, F1 (using <code>zero_division=0</code>) and AUC. Printing the pipeline shows the whole workflow as one object.</p>`],
["key","Why this is better",String.raw`<p>Earlier you did every step by hand, which creates opportunities for mistakes. The pipeline makes the sequence explicit and reproducible, and the preprocessing is fitted as part of training, which helps prevent data leakage.</p>`],
["","A small experiment",String.raw`<p>Make a one-row DataFrame whose Job Title is “Something Completely New”, a title probably absent from training, and call <code>model_pipeline.predict(new_employee)</code>. It works because of <code>handle_unknown="ignore"</code>.</p>`],
["key","A beginner mistake",String.raw`<p>“Since the test data is already available, I’ll run <code>get_dummies()</code> on the entire dataset and then split.” Preprocessing before the split can let test information influence the preprocessing. The safer workflow is: split first, learn preprocessing on the training data, apply it to training and test data. The pipeline helps enforce this.</p>`],
["","What about scaling?",String.raw`<p>Years of experience is on a modest scale, but imagine Age from 25 to 70, Income from 20,000 to 500,000 and Population from 1,000 to 10,000,000. Some models are affected by very different feature scales. Standardization transforms a variable to have roughly standard deviation 1; put numerical variables on a comparable scale when the model benefits, such as logistic regression with regularization, K-nearest neighbors and support vector machines. Because the <code>StandardScaler</code> sits inside the pipeline, it learns its mean and standard deviation from the training data and applies those to the test data.</p>`],
["ai","The standardization formula",String.raw`$$z=\frac{x-\mu}{\sigma}$$<p>Each value becomes its distance from the mean $\mu$ in units of the standard deviation $\sigma$, giving mean 0 and standard deviation 1. The Day 16 Coding Lab builds this exact pipeline in Python.</p>`],
["","The full pipeline and what comes next",String.raw`<p>The final version uses <code>("numeric", StandardScaler(), numeric_features)</code> and <code>("categorical", OneHotEncoder(handle_unknown="ignore"), categorical_features)</code> inside one <code>ColumnTransformer</code>, followed by the classifier. This lesson is about organizing the modeling process rather than a new algorithm: <code>ColumnTransformer</code> applies different preprocessing to different columns, <code>OneHotEncoder</code> converts categories, <code>StandardScaler</code> standardizes numbers, and <code>Pipeline</code> connects it all. With a proper pipeline, tuning can include the entire preprocessing: that is Day 17.</p>`]],
17:[
["","Let Python do the searching",String.raw`<p>The workflow so far was: choose a model, choose some settings, check the results. But how do you know the settings are any good? Logistic regression has a setting called <code>C</code> that has mostly been left at its default. Trying values by hand gets annoying quickly, so today Python does the searching: <b>hyperparameter tuning</b>.</p>`],
["key","Parameters versus hyperparameters",String.raw`<p><b>Parameters</b> are learned from the data, such as the age, experience and job-title coefficients. <b>Hyperparameters</b> are chosen before training, such as <code>LogisticRegression(C=1)</code>. The aim is to find better hyperparameter values.</p>`],
["","What does C mean?",String.raw`<p><code>C</code> controls the strength of regularization: a smaller <code>C</code> means stronger regularization, a larger <code>C</code> weaker, similar to Ridge and Lasso in <a href="#day-10">Day 10</a>. The exact mathematics can wait; for now <code>C</code> is something you can tune.</p>`],
["","Don’t tune on the test set",String.raw`<p>If you try several values and keep whichever scores best on the test set, you are using the test set to make modeling decisions, and it is supposed to represent unseen data. Use cross-validation on the <i>training</i> data instead, as in <a href="#day-12">Day 12</a>.</p>`],
["","Define the search",String.raw`<p>Reuse the pipeline from Day 16 (scaler and one-hot encoder inside a <code>ColumnTransformer</code>, then the logistic regression named <code>classifier</code>). The grid is a dictionary such as <code>{"classifier__C": [0.01, 0.1, 1, 10, 100]}</code>. The double underscore means “the parameter <code>C</code> of the step named <code>classifier</code>”, which becomes very useful as pipelines grow.</p>`],
["","GridSearchCV",String.raw`<p><code>GridSearchCV(pipeline, param_grid=param_grid, scoring="roc_auc", cv=5, n_jobs=-1)</code> takes the entire modeling workflow, the values to test, 5-fold cross-validation, ROC AUC as the comparison metric, and permission to use the available CPU cores. After <code>fit(X_train, y_train)</code>, <code>best_params_</code> is the best combination by the chosen CV score and <code>best_score_</code> is its average cross-validation score. The result depends on the dataset and on how the data is split.</p>`],
["key","Preprocessing happens inside each fold",String.raw`<p>Because the preprocessing is part of the pipeline, it is refitted inside each cross-validation training process. That is a really important detail: nothing from a validation fold leaks into the preprocessing.</p>`],
["","Use the best model, then the test set",String.raw`<p><code>best_model = grid_search.best_estimator_</code> is not just the best logistic regression but the complete pipeline: preprocessing plus the best classifier. Use it for <code>predict</code> and <code>predict_proba(X_test)[:, 1]</code>. Only now is the test set used, giving a final evaluation of the whole model-selection process. This is probably the single most important workflow lesson of the day.</p>`],
["","Look at all the results",String.raw`<p><code>pd.DataFrame(grid_search.cv_results_)</code> shows how every setting performed, so you are not blindly trusting <code>best_params_</code>.</p>`],
["key","A beginner mistake: the winner is not a constant",String.raw`<p>If the search picks <code>C = 10</code>, that is not a universal truth. It is the value that performed best among the values you asked about, on this dataset, with this split and metric. Give it <code>[0.001, 0.01, 0.1, 1, 10, 100, 1000]</code> and you might get a different winner. Tuning does not discover the one true model; it searches the options you provide.</p>`],
["","More than one parameter, and the cost",String.raw`<p>Adding more parameters, for example <code>C</code> together with <code>solver</code> (<code>liblinear</code>, <code>lbfgs</code>), tests every combination, which is why it is called a grid. But the more values you add, the more models must be fitted: 5 values of <code>C</code> with 2 solvers and 5 folds means 50 fits, and with many parameters the number of combinations explodes. That is why people avoid giant grids; <code>RandomizedSearchCV</code> samples from the search space instead of trying every combination.</p>`],
["","Takeaways and what comes next",String.raw`<p>Three big ideas: hyperparameters (settings chosen before training), cross-validation (compare settings using training data without touching the test set) and <code>GridSearchCV</code> (automates that search). The process is now systematic: training data, cross-validation, try several hyperparameters, compare with a chosen metric, select the best configuration, final test evaluation. One question remains: the search used AUC, but accuracy, precision, recall and F1 tell different stories, so what if the metric changes?</p>`]],
18:[
["key","The model doesn’t know what is important",String.raw`<p>Python does not know what “best” means; you must define it. <code>scoring="accuracy"</code> prefers the most correct predictions overall, <code>"recall"</code> prefers finding as many actual positives as possible, and <code>"precision"</code> prefers models whose positive predictions are more often correct. The metric is part of the problem definition.</p>`],
["","Same search, different scoring",String.raw`<p>Rebuild the Day 17 pipeline and use the same <code>param_grid</code>, but change only the <code>scoring</code> argument: <code>grid_accuracy</code>, <code>grid_recall</code>, <code>grid_precision</code> and <code>grid_f1</code>, each fitted on the training data. Each search answers a different question; with F1 it optimizes the balance between precision and recall.</p>`],
["","Compare the winners",String.raw`<p>Collect each search’s <code>best_params_</code> and <code>best_score_</code> in a DataFrame. The values may be similar or different; the exact result is not the point. The point is that the definition of “best” affects what the search is trying to optimize.</p>`],
["key","Another trap: comparing metrics with each other",String.raw`<p>Seeing accuracy 0.90, recall 0.70 and precision 0.80 and concluding the model is “best at accuracy” makes no sense. They measure different things, like comparing 90 kilometers with 70 kilograms. Choose the metric based on what you care about.</p>`],
["","Think about the mistakes",String.raw`<p>Recall the confusion matrix. A <b>false positive</b> predicts high salary when it is not; a <b>false negative</b> predicts low salary when the actual salary is high. Depending on the application you may care more about one, which changes the useful metric.</p>`],
["","A different problem",String.raw`<p>Imagine detecting a serious disease. Missing someone who has it is a false negative, so recall may be especially important. Now imagine a system where every positive prediction triggers an expensive investigation: false positives matter more and precision becomes more important. The model has not changed; the consequences of the mistakes have.</p>`],
["","Accuracy can be misleading",String.raw`<p>With 95% in class 0 and 5% in class 1, a terrible model that predicts 0 for everybody gets about 95% accuracy but identifies nobody from class 1. High accuracy does not automatically mean useful classification.</p>`],
["","Evaluate every selected model on the test set",String.raw`<p>So far only cross-validation scores were used. Take each <code>best_estimator_</code> and evaluate it on the untouched test set, for example <code>classification_report</code> for the recall-optimized model. A helper function <code>evaluate_model(model, X_test, y_test)</code> returning accuracy, precision, recall, F1 and AUC lets you put all the test results in one DataFrame.</p>`],
["key","Another subtle beginner mistake",String.raw`<p>Run four searches, look at the test results, and choose whichever looks best. That is not necessarily wrong if you are explicitly comparing strategies for a defined purpose, but if you keep using the test set to make decisions you eventually adapt to it too. For a serious project, define the evaluation strategy before experimenting repeatedly.</p>`],
["","There isn’t always one best model",String.raw`<p>“Which model is best?” is an incomplete question. Better: <i>best for what?</i> Overall correctness suggests accuracy; finding as many positives as possible suggests recall; positive predictions that are usually correct suggest precision; a balance suggests F1; ranking and separation across thresholds suggests ROC AUC. The metric helps define what the model-selection process optimizes.</p>`],
["ai","Scorer names and direction",String.raw`<p><code>"accuracy"</code>, <code>"precision"</code>, <code>"recall"</code>, <code>"f1"</code> and <code>"roc_auc"</code> are all “higher is better” scorers, so <code>best_score_</code> is the maximum. Error metrics such as RMSE appear negated (<code>neg_root_mean_squared_error</code>), as in <a href="#day-12">Day 12</a>. Compare the metrics in the Day 18 Coding Lab.</p>`],
["","Takeaways and what comes next",String.raw`<p>You have to define what you want the model to do, then choose an evaluation metric that reflects that goal. <code>GridSearchCV</code> is not just “find the best model”; it finds the best model for the objective you gave it. The workflow is now: preprocessing, cross-validation, hyperparameter tuning, metric selection, final test evaluation. But logistic regression is only one model family. What about a model that makes nonlinear decisions?</p>`]],
19:[
["","A completely different idea",String.raw`<p>Logistic regression rests on a fairly structured mathematical relationship. Decision trees work very differently: the model asks a series of questions, such as “Is experience greater than 8 years? Is age greater than 35?”, and eventually reaches a prediction. Can a bunch of simple questions beat logistic regression?</p>`],
["","What is a decision tree?",String.raw`<p>A sequence of decisions: split on “Experience > 8?”, then ask follow-up questions on each branch (“Age > 35?”, “Experience > 3?”) until each path ends in a prediction. Logistic regression learns a mathematical relationship between predictors and probability. A tree instead repeatedly divides the data into smaller groups, which can naturally create <b>nonlinear decision boundaries</b>.</p>`],
["","Train and evaluate a first tree",String.raw`<p>Use the numerical variables, split the data, then <code>DecisionTreeClassifier(random_state=42).fit(X_train, y_train)</code>. Get <code>predict</code> and <code>predict_proba(X_test)[:, 1]</code> and evaluate accuracy, precision, recall, F1 and AUC. You can draw the tree with scikit-learn’s plotting function (<code>figsize=(20, 10)</code>, <code>feature_names=X.columns</code>); it can get surprisingly complicated, so how does the model decide how big it should be?</p>`],
["key","The overfitting problem",String.raw`<p>Left unrestricted, a tree keeps splitting and can create rules that describe tiny groups of observations, almost memorizing the training data. 100% training accuracy sounds amazing, but if test accuracy is only 70% the tree learned the training data too specifically. You need to control its complexity.</p>`],
["","Limit the depth",String.raw`<p><code>max_depth</code> controls how deep the tree may grow. Loop over several depths, record train and test accuracy for each in <code>depth_results</code>, and plot both against depth. As the tree becomes more complex, training performance can keep improving without test performance following.</p>`],
["ai","Try it yourself",String.raw`<p>The Day 19 Coding Lab runs exactly this loop on synthetic data, and the formula there shows the Gini impurity each split tries to reduce: $G=1-\sum_k p_k^2$.</p>`],
["","This looks familiar",String.raw`<p>It is the same pattern as polynomial regression: too simple underfits, too complicated overfits, and somewhere between there may be a useful level of complexity. It is another view of the <b>bias–variance tradeoff</b>; no need to master the theory yet. The practical lesson: more complex does not automatically mean better.</p>`],
["","Compare with logistic regression",String.raw`<p>Build a table of accuracy, precision, recall, F1 and AUC for both models. Do not assume one is better because one number is higher; remember <a href="#day-18">Day 18</a> and first ask which metric you are optimizing.</p>`],
["","Trees and scaling, trees and categories",String.raw`<p>A tree decides using thresholds such as <code>Years of Experience <= 7.5</code>, so it does not need <code>StandardScaler()</code> to make age and experience comparable. That makes tree models convenient with mixed data. But a tree cannot use text like <code>Education Level = Bachelor's</code>, so categories still need one-hot encoding. Put <code>OneHotEncoder(handle_unknown="ignore")</code> and the tree into a pipeline, as in Day 16.</p>`],
["","Other hyperparameters and tuning",String.raw`<p>Trees have their own hyperparameters: <code>max_depth</code>, <code>min_samples_split</code> and <code>min_samples_leaf</code>. Different algorithms have different hyperparameters, and the same <code>GridSearchCV</code> idea tunes them: <code>GridSearchCV(tree_pipeline, param_grid=tree_param_grid, scoring="roc_auc")</code>, then evaluate <code>best_estimator_</code> on the test set.</p>`],
["","Takeaways and what comes next",String.raw`<p>A decision tree is a sequence of learned questions that repeatedly splits observations into smaller groups. Trees overfit easily, and parameters like <code>min_samples_leaf</code> help control complexity. <b>The algorithm changed, but the machine-learning workflow stayed the same:</b> pipeline, cross-validation, metric, final test. Choosing a model is not about the fanciest algorithm but about the problem, preprocessing, complexity, hyperparameters, metrics and generalization. One limitation: a single tree is unstable, because a small change in the training data can produce a very different tree. What if you built many?</p>`]],
20:[
["","One tree isn’t enough",String.raw`<p>A single tree can be very sensitive to the data: change the data slightly and you may get a very different tree, and if it grows too much it overfits. So build hundreds of trees instead: a <b>Random Forest</b>.</p>`],
["","The basic idea: an ensemble",String.raw`<p>Ask one person a question and they may be wrong; ask many and combine the opinions. That is the intuition behind an <b>ensemble</b> model. A forest is a collection of trees whose predictions are combined into one.</p>`],
["","Why “random”?",String.raw`<p>The trees are deliberately not all built the same way. Different trees are trained on different samples of the training data, and they may consider different subsets of features when splitting. The goal is for the trees to be somewhat different from each other: if every tree made the same mistakes, 500 trees would not help much.</p>`],
["","Build and compare",String.raw`<p><code>RandomForestClassifier(n_estimators=100, random_state=42)</code> builds 100 trees. Fit it on the same training data, get <code>predict</code> and <code>predict_proba(X_test)[:, 1]</code>, and put tree and forest metrics side by side. Do not automatically declare one “better”: it depends on the metric and on behavior under validation.</p>`],
["","How many trees?",String.raw`<p>Loop over a list of <code>n_estimators</code> values and plot test AUC against the number of trees. More trees do not necessarily bring dramatic improvements; at some point there are diminishing returns, and more trees raise computational cost. More is not automatically better.</p>`],
["","Hyperparameters of a forest",String.raw`<p>Number of trees (<code>n_estimators</code>), maximum depth of each tree (<code>max_depth</code>), the minimum observations allowed in a leaf (<code>min_samples_leaf</code>), <code>min_samples_split</code>, and how many features a tree considers at each split. They control the forest’s complexity and randomness.</p>`],
["","Why forests can reduce overfitting",String.raw`<p>One deep tree becomes very specific to the training data. A forest combines many different trees. For classification think of it as voting: if most trees predict one class, the forest predicts it. The probability output gives a more detailed estimate.</p>`],
["ai","How the probability is formed",String.raw`$$\hat p(x)=\frac1B\sum_{b=1}^{B}\hat p_b(x)$$<p>scikit-learn averages the predicted class probabilities of the $B$ trees rather than counting hard votes. Compare a single tree with a forest in the Day 20 Coding Lab.</p>`],
["","Categorical variables, a pipeline and tuning",String.raw`<p>Add Education Level and other categories: split the data, one-hot encode the categorical columns with <code>handle_unknown="ignore"</code>, pass the numeric columns through, and put everything in a pipeline with <code>RandomForestClassifier(n_estimators=200, random_state=42)</code>. No <code>StandardScaler</code> is needed, because trees and forests do not depend on feature magnitude in the way some models do. Tune with <code>GridSearchCV</code> as in <a href="#day-17">Day 17</a>, then evaluate <code>best_estimator_</code> on the test set.</p>`],
["","Looking inside a forest: feature importance",String.raw`<p>You cannot draw hundreds of trees, but the fitted forest has <code>feature_importances_</code>. After one-hot encoding, the original categories have expanded into many columns, so get their names from <code>named_steps["preprocessor"].get_feature_names_out()</code>, put names and importances in a DataFrame, sort and look at the top 15. This shows which encoded features the forest relied on most according to its built-in measure.</p>`],
["key","Feature importance is not causation",String.raw`<p>If Years of Experience has high importance, that does not mean experience causes higher salary. It means the feature was useful in the trees’ splitting process. Machine-learning feature importance is about prediction, not automatically a causal analysis.</p>`],
["ai","A caution about built-in importance",String.raw`<p>The built-in measure is computed from how much splits reduce impurity on the training data, and it can favor features with many distinct values or many one-hot columns. <a href="#day-22">Day 22</a> introduces a more reliable check: permutation importance.</p>`],
["","Bagging",String.raw`<p>Part of what a forest does is <b>bagging</b>, short for Bootstrap Aggregating: each tree is trained on a somewhat different bootstrap sample of the training data, and the predictions are aggregated. A forest adds another layer of randomness by considering subsets of features at each split, which makes the individual trees less correlated.</p>`],
["","Takeaways and what comes next",String.raw`<p>One tree can be unstable; a Random Forest combines many into an ensemble. <code>n_estimators</code> sets the number of trees, <code>max_depth</code> the depth, <code>min_samples_leaf</code> how small leaves can get. Forests need no scaling but still need categories encoded, pipelines keep preprocessing and modeling together, and feature importance describes what the model used, not what causes salary. Sometimes a better model is not one that thinks harder but one that combines many different models. Next: ensembles that build models <i>sequentially</i>, each learning from the mistakes of the last, which is Gradient Boosting.</p>`]],
21:[
["","Trees built one after another",String.raw`<p>Random Forest builds many trees independently. Gradient Boosting builds them <b>sequentially</b>: start with a simple model, look at its errors, build another model that corrects some of them, update the prediction, look at the remaining errors, and repeat. That is the important difference.</p>`],
["","Why small trees?",String.raw`<p>Why not one huge tree? Overfitting. Boosting often uses relatively simple trees that each make a small contribution: tree 1 makes a rough prediction, tree 2 fixes some mistakes, tree 3 fixes more, and so on. Many small trees gradually improve the model instead of one tree solving everything.</p>`],
["ai","The additive picture",String.raw`$$F_m(x)=F_{m-1}(x)+\eta\,h_m(x)$$<p>Here $F_{m-1}$ is the current model, $h_m$ the new small tree fitted to its errors, and $\eta$ the learning rate. The Day 21 Coding Lab compares different numbers of stages.</p>`],
["","Build and evaluate one",String.raw`<p>Use the same predictors and split, then <code>GradientBoostingClassifier(random_state=42).fit(X_train, y_train)</code>, with <code>predict</code>, <code>predict_proba(X_test)[:, 1]</code> and the usual metrics (accuracy, precision, recall, F1, AUC).</p>`],
["","n_estimators: the number of stages",String.raw`<p>As in a forest, <code>n_estimators</code> matters, but the meaning differs slightly: it controls how many boosting stages (trees) are added. Loop over several values and plot test AUC against the number of trees. More stages give more opportunities to improve, but eventually extra complexity can stop helping or even hurt generalization.</p>`],
["key","The learning rate",String.raw`<p>Each new tree suggests a correction; <code>learning_rate</code> controls how much of that correction is actually used. A high rate learns aggressively from each tree; a low rate learns cautiously. The learning rate and number of trees interact: a large rate may reach a useful model quickly, a smaller one may need more trees. There is no single magic learning rate; it depends on the data and the other hyperparameters.</p>`],
["","Tune the grid",String.raw`<p>Time for Grid Search again: <code>GridSearchCV(GradientBoostingClassifier(random_state=42), param_grid=param_grid, scoring="roc_auc")</code> over the number of trees, the learning rate and <code>max_depth</code>. Then evaluate <code>best_estimator_</code> on the test set.</p>`],
["","Does boosting need scaling?",String.raw`<p>For the standard scikit-learn Gradient Boosting classifier, scaling is not generally required, because the model is based on decision trees that split on thresholds, and multiplying a numeric feature by a constant does not change the ordering of observations. A useful practical rule: linear and logistic models, scaling may matter; tree-based models, it usually does not (with exceptions for other algorithms).</p>`],
["","Categories and the pipeline",String.raw`<p>Add Education Level and other categorical variables with the same <code>ColumnTransformer</code> (numeric passthrough, <code>OneHotEncoder(handle_unknown="ignore")</code>) and put <code>GradientBoostingClassifier</code> in a pipeline. By now the workflow should feel familiar: <b>the algorithm changes, but the workflow doesn’t</b>: define the target, split, preprocess, fit, validate or tune, evaluate on test data, interpret.</p>`],
["key","Random Forest versus Gradient Boosting",String.raw`<p>Random Forest = many trees built largely independently and designed to be diverse. Gradient Boosting = trees built sequentially, each stage trying to improve the current model.</p>`],
["key","A mistake to avoid",String.raw`<p>Seeing boosting do well on the test set and declaring it “the best model” is not necessarily justified: you have tried many models, hyperparameters and metrics, and if you keep checking the test set you gradually make decisions based on it. Select models using the training data and cross-validation, then do one final test evaluation.</p>`],
["","Takeaways and what comes next",String.raw`<p>Start with a model, look at what it gets wrong, build another small model to improve those mistakes, and repeat. <code>n_estimators</code> sets the stages, <code>learning_rate</code> how strongly each contributes, <code>max_depth</code> the size of each tree. More trees or a higher learning rate are not automatically better. A model does not have to solve the whole problem in one step; it can improve gradually. Next: instead of only predicting well, why did the model make <i>this</i> prediction?</p>`]],
22:[
["","Prediction versus explanation",String.raw`<p>A model says an employee has an 87% chance of high salary. That is a prediction, but was it because of Years of Experience, Education or Job Title, and how much did each matter? The model knows how to predict; do you understand the prediction? That is <b>model interpretability</b>.</p>`],
["","Feature importance",String.raw`<p>Go back to the Random Forest: get names with <code>named_steps["preprocessor"].get_feature_names_out()</code> and values with <code>named_steps["classifier"].feature_importances_</code>, build a DataFrame sorted from largest to smallest, and plot the top features as a horizontal bar chart. It looks like an explanation, but there is a catch.</p>`],
["key","Important does not mean causal",String.raw`<p>If Years of Experience has high importance, you cannot conclude that experience causes higher salary. Feature importance describes the model’s prediction process, not what causes salary. Be careful with the language you use.</p>`],
["","Another limitation",String.raw`<p>If two variables carry similar information, the model may spread importance between them in ways that are hard to interpret, so do not blindly read the ranking as the final truth. Interpretation methods have limitations too.</p>`],
["","Permutation importance",String.raw`<p>With the model already trained, take one feature and randomly shuffle its values. If scrambling it causes a large drop in performance, the feature was useful to the model; if performance barely changes, the model was probably not relying on it. In code: <code>permutation_importance(model, X_test, y_test, scoring="roc_auc", random_state=42)</code>, then a sorted DataFrame and bar chart.</p>`],
["ai","Try it",String.raw`$$\text{importance}_j=\text{score}_{\text{original}}-\text{score}_{\text{feature }j\text{ shuffled}}$$<p>The Day 22 Coding Lab runs permutation importance on synthetic data, where you can see an irrelevant feature stay near zero.</p>`],
["","Why the two methods differ",String.raw`<p>The built-in importance asks how useful a feature was for the tree-splitting process; permutation importance asks what happens to performance if you destroy that feature’s information. They are different questions, so compare several methods instead of relying on one.</p>`],
["","Local explanations and SHAP",String.raw`<p>So far the view is <i>global</i>: what the model generally relies on. A <b>local</b> explanation answers why <i>this</i> employee (say 10 years of experience, Master’s, Data Analyst, 82% probability) got this prediction. <b>SHAP</b> (SHapley Additive exPlanations) breaks a prediction into contributions: a baseline (such as the model’s average prediction), then the contribution of each feature, leading to the final prediction. Features can push the prediction higher or lower relative to the baseline.</p>`],
["","SHAP in practice",String.raw`<p>In Colab, <code>!pip install shap</code>, then fit a forest on the numeric predictors, create <code>explainer = shap.TreeExplainer(forest)</code> and compute SHAP values. The returned object can differ by SHAP version and model output, so inspect it with <code>type(shap_values)</code> and <code>np.shape(shap_values)</code>: a useful habit whenever a library returns something unfamiliar. A global view comes from <code>shap.plots.beeswarm</code>, which shows which features matter, how much, and whether high values push predictions up or down. A single employee is explained with <code>shap.plots.waterfall</code> for <code>X_test.iloc[[0]]</code>.</p>`],
["ai","About the Coding Lab",String.raw`<p>SHAP is a separate library, so the Coding Lab demonstrates permutation importance only. Try SHAP in Colab or on your own computer.</p>`],
["key","Interpretability isn’t truth",String.raw`<p>If SHAP says a feature pushed the prediction up, that does not mean it changes salary in the real world. It explains the model’s behavior, not the world. Distinguish what the model learned from what is actually true; they can differ.</p>`],
["","Three levels of interpretation",String.raw`<p><b>Level 1, model performance:</b> how well does it predict? <b>Level 2, global interpretation:</b> what does it generally rely on (feature importance, permutation importance, SHAP summary plots)? <b>Level 3, local interpretation:</b> why this particular prediction (SHAP waterfall plots)?</p>`],
["","Takeaways and what comes next",String.raw`<p>Building a model is not necessarily the end. Feature importance shows what was useful to the model, permutation importance shows how performance changes when a feature’s information is disrupted, and SHAP explains individual and overall behavior. A model explanation tells you how the model made its prediction, not what causes the outcome. But all of this assumed the data was clean. Real-world data rarely is, so Day 23 returns to the data itself.</p>`]],
23:[
["","Is the dataset correct?",String.raw`<p>Models have been built, tuned and explained, but the dataset has been assumed to be correct. What if there are missing values, duplicates, an age of 250, a negative salary, or two job titles that mean the same thing but are spelled differently? A model does not know the data is wrong; it learns from bad data as easily as from good data.</p>`],
["key","Garbage in, garbage out",String.raw`<p>If the input data is wrong, a very confident prediction is still wrong. Before worrying about the perfect algorithm, understand the dataset itself.</p>`],
["","Missing values",String.raw`<p><code>df.isna().sum()</code> counts missing values per column and <code>df.isna().mean() * 100</code> gives percentages. If you find some, do not blindly delete everything: ask why they are missing. Missing is not the same as zero, and “not provided” is not the same as “not applicable”. What to do depends on why it is missing and what the variable represents.</p>`],
["","Duplicates",String.raw`<p><code>df.duplicated().sum()</code>; if it is above zero, investigate. A duplicate is not automatically an error: two different employees can genuinely have identical values. You need to know what defines a unique observation. Duplicate-looking rows are not necessarily duplicate records.</p>`],
["","Data types and unique values",String.raw`<p>Check that each variable has the right type: a salary stored as text such as <code>"60000"</code> is not the same as the number 60000. For categorical variables, <code>value_counts()</code> on Education Level, Gender and Job Title reveals inconsistencies: values that humans see as the same category but that the computer sees as different strings. With <code>OneHotEncoder</code>, every different spelling becomes its own feature.</p>`],
["","Cleaning text categories",String.raw`<p>A simple first step is to strip extra whitespace (<code>df["Job Title"].str.strip()</code>) and, where appropriate, standardize capitalization. Lowercasing is safe for many text categories, but not every transformation is appropriate. The principle: standardize only when you understand what the values mean.</p>`],
["","Numerical sanity checks",String.raw`<p>Look at <code>describe()</code> and ask whether the values make sense. For Age check <code>min()</code>, <code>max()</code> and <code>df["Age"] > 100</code>; for experience check whether it is consistent with age with <code>df["Years of Experience"] > df["Age"]</code>; for salary check <code>df["Salary"] < 0</code> and extremely high values. If something looks strange, investigate before changing: it could be a data-entry error, a variable that means something different than you thought, or a genuine unusual observation. Suspicious does not automatically mean incorrect.</p>`],
["ai","A rule of thumb for extremes",String.raw`$$x<Q_1-1.5\,\mathrm{IQR}\ \text{ or }\ x>Q_3+1.5\,\mathrm{IQR}$$<p>This common rule flags candidates for inspection; it does not say they are wrong. The Day 23 Coding Lab audits a small messy table.</p>`],
["","Visual inspection",String.raw`<p>Histograms of salary, experience and age reveal problems immediately. They have been used since Day 1 and are not just pretty charts; they are data-quality tools.</p>`],
["key","Outliers versus errors",String.raw`<p>A salary far above everyone else is not necessarily an error. Ask whether it is plausible; if not, investigate or correct it according to the data source. Do not remove observations simply because they make the model inconvenient: outliers can strongly affect models, but the response is to understand them.</p>`],
["","Suspicious combinations",String.raw`<p>Sometimes the problem is the relationship between variables rather than one variable, such as experience larger than age. Check combinations as well as columns. Data cleaning is more than filling missing cells: it is checking whether relationships between variables make sense.</p>`],
["key","Cleaning can cause leakage too",String.raw`<p>Suppose you fill missing ages with <code>df["Age"].median()</code> computed before splitting. The median used the test rows, so information from the test distribution has entered your training workflow. A safer approach is to learn preprocessing from the training data. Use a <code>SimpleImputer</code> (<code>strategy="median"</code> for numbers, <code>"most_frequent"</code> for categories) inside a pipeline so imputation is part of the modeling pipeline, which is much safer.</p>`],
["","A data-quality checklist",String.raw`<p>Structure: how many columns, and what does each row represent? Missing values: which columns, how much, why? Duplicates: are they expected, and what defines a unique observation? Types: are numerical variables numeric? Categories: consistent, spelling and capitalization differences, rare categories? Numbers: plausible, impossible values, extremes, do variables make sense together? Finally: am I accidentally using test-set information?</p>`],
["","Takeaways and what comes next",String.raw`<p>Today was about checking missing values, inconsistent categories, impossible values and suspicious relationships, not building a model. Data cleaning is not deleting everything that looks unusual: it is understanding what the data means and choosing an appropriate treatment. A sophisticated model can produce an impressive prediction from flawed inputs. Next: once you find missing values, what should you actually do with them?</p>`]],
24:[
["","Finding is only half the problem",String.raw`<p>After checking for duplicates, types, unusual values and missing values, the harder question is what to do about them: delete the row, replace the value, use the mean, the most common value, or leave it alone? Start by seeing what you are dealing with: <code>df.isna().sum()</code> and the percentages. There is a big difference between 5 missing values and 5,000.</p>`],
["","Missing data isn’t automatically bad",String.raw`<p>An employee may not have provided their education level, a survey participant may have skipped a question, or the information may simply not have been collected. The important question is <i>why</i> the value is missing, because the reason affects what to do. A missing salary is very different from a salary of zero.</p>`],
["","Option one: delete rows",String.raw`<p><code>df_drop = df.dropna()</code> removes rows with any missing value (complete-case analysis or listwise deletion). Check how many observations you lose. If only a tiny fraction is missing, this can be perfectly reasonable. But if a lot of data is missing, you throw away a huge amount of information, and the missing rows may not be random: if higher earners are less likely to report salary, deleting missing salaries can leave a dataset that does not represent the original population. Deletion is not automatically wrong, but not automatically right either.</p>`],
["","Option two: imputation",String.raw`<p><b>Imputation</b> means replacing a missing value with an estimated value. The simplest choices are the mean, the median and, for categories, the mode.</p>`],
["","Mean versus median",String.raw`<p>Fill with <code>df["Age"].mean()</code> via <code>fillna()</code> and the gaps are gone. But the mean is sensitive to extreme values: one very high salary pulls it upward, while the median is usually more resistant. For strongly skewed variables the two can differ a lot, so median imputation often makes more sense. Either way, did you recover the person’s real age? No: imputation does not magically recover information, it creates a value according to a rule.</p>`],
["key","A problem with simple imputation",String.raw`<p>If there were 10,000 missing values, you would create thousands of identical imputed values. This can reduce the apparent variability of the variable: simple imputation can make the data look more certain than it really is. There is no magic solution.</p>`],
["ai","Missingness mechanisms",String.raw`<p>Statisticians distinguish values missing completely at random, missing at random given other variables, and missing not at random (for example high earners hiding their salary). Deletion and simple imputation are most defensible in the first case. The Day 24 Coding Lab fills gaps with the median and the mode.</p>`],
["","Categorical variables: mode or “Unknown”",String.raw`<p>You cannot calculate the mean education level. <b>Mode imputation</b> fills with the most frequent value (<code>df["Education Level"].mode()[0]</code>), assuming the most common category is a reasonable replacement for every missing one, which may not be true. Alternatively, label gaps explicitly with <code>fillna("Unknown")</code>: you are not pretending the missing value was Bachelor’s, which can be more honest.</p>`],
["","Be careful with “Unknown”",String.raw`<p>If the fact that something is missing is related to the outcome, “Unknown” may contain useful information: people who do not report education may differ systematically. That does not mean you should automatically use it as a predictor; you still need to understand the data-generating process.</p>`],
["","Use scikit-learn’s SimpleImputer",String.raw`<p>Computing <code>df["Age"].median()</code> before splitting uses the test data too (leakage). <code>SimpleImputer(strategy="median")</code> or <code>"mean"</code> for numbers, <code>strategy="most_frequent"</code> for categories, or <code>strategy="constant", fill_value="Unknown"</code> learn the value from the training data inside a pipeline.</p>`],
["ai","Remembering that a value was missing",String.raw`<p><code>SimpleImputer(add_indicator=True)</code> adds a 0/1 column marking which values were imputed, so the model can use the fact that a value was missing.</p>`],
["","The complete preprocessing pipeline",String.raw`<p>Numeric transformer: <code>Pipeline([("imputer", SimpleImputer(strategy="median")), ("scaler", StandardScaler())])</code>. Categorical transformer: <code>Pipeline([("imputer", SimpleImputer(strategy="most_frequent")), ("onehot", OneHotEncoder(handle_unknown="ignore"))])</code>. Combine them in a <code>ColumnTransformer</code> and add a model such as <code>LogisticRegression</code>. The pipeline learns the preprocessing from the training data and applies the same steps to test data, which reduces the chance of leakage. This is one of the biggest reasons pipelines are useful.</p>`],
["","Different problems, different solutions",String.raw`<p>There is no universal strategy. The right choice depends on the variable, how much is missing, why it is missing, and the consequences of a wrong assumption: very little missing might mean remove rows or impute; numeric variables suit mean, median or model-based methods; categorical variables suit the mode, “Unknown” or another justified method.</p>`],
["","Two beginner mistakes",String.raw`<p>Forgetting the parentheses: <code>df.isna.sum()</code> does nothing useful; it must be <code>df.isna().sum()</code>. And <code>df["Age"].fillna(df["Age"].median())</code> does not permanently change <code>df</code>; it returns a new Series. Save it with <code>df["Age"] = ...</code>, or better for a modeling workflow, put the transformation in a pipeline.</p>`],
["key","What not to do automatically",String.raw`<p>Do not automatically delete every incomplete row, replace everything with the mean, pretend imputed values are real observations (they are estimates), calculate preprocessing statistics on the whole dataset before splitting, or use the same strategy for every variable (age, salary, education level and job title are different types).</p>`],
["","Takeaways and what comes next",String.raw`<p>You can remove incomplete observations, use mean or median imputation, use the mode, create an “Unknown” category, or use more sophisticated approaches. The biggest lesson is not a technique: missing data is information about the dataset that you need to understand before deciding how to handle it, and in a modeling workflow preprocessing belongs in the pipeline. Python code is often the easy part; the hard part is deciding what it should do. Next: what if the model accidentally gets access to the answer during training? That is data leakage.</p>`]],
25:[
["","What if the model sees part of the answer?",String.raw`<p>The model could look incredibly accurate without actually being good, like cheating on an exam, and the scary part is that you might not realize you are doing it. <b>Data leakage</b> is when information that should not be available at prediction time somehow enters the training process. If a professor gives you the answer sheet before the exam, that does not mean you learned the material; the model has the same problem, and its results look artificially good.</p>`],
["","The obvious case",String.raw`<p>The target is <code>High_Salary = (df["Salary"] >= 100000)</code>. If <code>Salary</code> stays in the features, the model effectively has the answer: Salary ≥ 100000 means High_Salary = 1. That is not prediction, it is cheating. Train a logistic regression with it included and you may get a very impressive accuracy, but you gave the model the variable that directly defines the target. The correct version uses only information that would actually be available when making the prediction.</p>`],
["","Leakage isn’t always obvious: the timeline test",String.raw`<p>Predicting whether an employee will leave? An “Exit Interview Score” may be highly predictive, but if the interview happens after the employee leaves, you could not have used it at prediction time: it contains information from the future (<b>temporal leakage</b>). Likewise, when predicting loan default, “missed payments” appear only after approval. Imagine a timeline with a prediction point: a model may only use information available before it.</p>`],
["key","Leakage through preprocessing",String.raw`<p>Compute <code>df["Age"].median()</code> on the entire dataset and fill missing values <i>before</i> splitting, and the median used both training and test rows, so information from the test set influenced the training process. It looks harmless, but the test set is no longer completely independent. Pipelines help: the preprocessing statistics are learned from the training data and then applied to the test data.</p>`],
["","Build it properly",String.raw`<p>Start from the raw features, split, then define numeric and categorical pipelines: numeric imputer with <code>strategy="median"</code> plus <code>StandardScaler()</code>; categorical imputer with <code>"most_frequent"</code> plus <code>OneHotEncoder(handle_unknown="ignore")</code>; combine in a <code>ColumnTransformer</code>, then add <code>LogisticRegression</code>. The preprocessing is learned from the training data and the same learned transformations are applied to the test data.</p>`],
["","Leakage during cross-validation",String.raw`<p>Preprocess the whole dataset first and then run <code>cross_val_score</code>, and the preprocessing has already seen every observation, so information leaks between folds. Put the preprocessing <i>inside</i> the pipeline and pass the pipeline to <code>cross_val_score(..., scoring="roc_auc")</code>: each fold fits the preprocessing on its training portion and applies it to its validation portion.</p>`],
["ai","See it with pure noise",String.raw`<p>The Day 25 Coding Lab selects features using all the labels on data that is pure noise. The “leaky” cross-validation looks much better than the honest pipeline version, which should hover near chance, even though no model can truly predict random labels.</p>`],
["","Leakage through feature engineering",String.raw`<p>Leaving salary in the features is leakage. A subtler example: <code>average_salary_by_job = df.groupby("Job Title")["Salary"].mean()</code> used as a feature. It looks clever, but if the average was computed with the whole dataset, including test observations, the target values in the test data influenced your feature. The code can look completely reasonable (“it’s only an average!”), so always ask: <i>what data was used to calculate that average?</i></p>`],
["key","A general rule",String.raw`<p>Whenever you create a feature, transformation, encoding, statistic or preprocessing step, ask whether it used information from validation or test data. That covers scaling parameters, category mappings, feature selection, target encoding, dimensionality reduction, model selection and engineered features. If the answer is yes, rethink the workflow.</p>`],
["key","Leakage versus overfitting",String.raw`<p>They sound similar but differ. In overfitting the model learns the training data too closely, so training performance is high and test performance poor. In leakage the model gets access to information it should not see, producing artificially good evaluation. Leakage can make overfitting harder to notice, because the evaluation itself is contaminated.</p>`],
["","A leakage checklist",String.raw`<p>(1) Does any feature directly contain the target? (2) Does any feature happen after the prediction time? (3) Did I calculate preprocessing statistics on the whole dataset? (4) Did I do feature engineering before splitting? (5) Did I do feature selection using all observations? (6) Is preprocessing inside the cross-validation workflow? The best single question: <i>would this information really be available when I need to make the prediction?</i> If not, do not give it to the model.</p>`],
["","Takeaways and what comes next",String.raw`<p>Leakage happens when the target is in the features, when future information is used, when you preprocess the entire dataset before splitting, when features use validation or test data, when model selection is done incorrectly, or when preprocessing sees information outside the current training fold. The worst part is that the model looks better because of it. A good workflow means understanding the data, splitting correctly and preprocessing without leakage. Next: build one reusable pipeline from beginning to end.</p>`]],
26:[
["","The repeated workflow",String.raw`<p>Every new model repeats the same steps: split, handle missing values, encode categories, scale numbers, train, evaluate. Change the model and part of the code gets rewritten, which is messy and error-prone. The question: can all of it go into one reusable pipeline, so the code remembers the workflow?</p>`],
["","What is a pipeline?",String.raw`<p>A sequence of steps (handle missing values, encode categories, scale, model) connected together. The advantage is consistency: if you train one way, new data is processed in exactly the same way.</p>`],
["","Raw data and a deliberate omission",String.raw`<p>Create <code>High_Salary</code> from <code>Salary</code>, then define the features and <b>deliberately leave Salary out</b>: it directly determines the target, so including it would be leakage (<a href="#day-25">Day 25</a>). Split <i>before</i> learning anything, so the test set stays unseen while the training workflow learns its preprocessing and model parameters.</p>`],
["","Numerical and categorical pipelines",String.raw`<p>Tell Python which columns are numeric and which categorical, since different types need different transformations: Age can be scaled; Job Title needs encoding. Numeric: <code>Pipeline([("imputer", SimpleImputer(strategy="median")), ("scaler", StandardScaler())])</code>. Categorical: <code>Pipeline([("imputer", SimpleImputer(strategy="most_frequent")), ("onehot", OneHotEncoder(handle_unknown="ignore"))])</code>. <code>handle_unknown="ignore"</code> means a category not seen in training does not crash the encoder, useful in real-world applications.</p>`],
["","Combine and add the model",String.raw`<p><code>ColumnTransformer</code> applies the numeric pipeline to the numeric columns and the categorical pipeline to the categorical ones. Then <code>Pipeline([("preprocessor", preprocessor), ("classifier", LogisticRegression(...))])</code> joins missing-value handling, encoding and the model in one object.</p>`],
["key","The pipeline is a model object",String.raw`<p><code>pipeline.fit(X_train, y_train)</code> learns the preprocessing parameters from the training data, transforms the training data and fits the classifier. <code>pipeline.predict(X_test)</code> applies the learned preprocessing to the raw test data and generates predictions. You pass raw test data; you never transform it manually. That consistency is the whole point. Evaluate with the metrics you already know.</p>`],
["","Swap in other models",String.raw`<p>Replace the classifier: <code>RandomForestClassifier(n_estimators=200, random_state=42)</code> or <code>GradientBoostingClassifier(random_state=42)</code> inside a pipeline with the same preprocessing. Same preprocessing, different model: powerful.</p>`],
["","A small complication",String.raw`<p>Not all models need the same preprocessing: logistic regression generally benefits from scaling numeric variables, while tree-based models usually do not. So do not blindly add transformations just because you can. A pipeline is not a magic recipe; it is a structured way to define the workflow you actually want.</p>`],
["","Pipeline plus cross-validation and tuning",String.raw`<p><code>cross_val_score(pipeline, X_train, y_train, scoring="roc_auc")</code> runs preprocessing inside each training fold, which is exactly what you want. With <code>GridSearchCV(pipeline, param_grid=param_grid, scoring="roc_auc", ...)</code>, the double underscore addresses parameters of a step (<code>classifier__C</code>), and the entire pipeline is evaluated, not just the classifier. After model selection, evaluate <code>grid_search.best_estimator_</code> once on the untouched test set.</p>`],
["ai","Inspecting a pipeline",String.raw`<p><code>pipeline.named_steps</code> gives access to each fitted step and <code>pipeline.get_params()</code> lists every settable parameter name, which is how you find the <code>step__parameter</code> names for a grid. The Day 26 Coding Lab cross-validates an imputing, scaling pipeline.</p>`],
["","Why reproducibility matters",String.raw`<p>Six months from now, if you scaled here, encoded there and imputed somewhere else by hand, you would have to remember exactly what you did. With a pipeline, one object contains the entire workflow. Data science is not just getting a result once; it is being able to get it again.</p>`],
["key","A pipeline isn’t automatically correct",String.raw`<p>Putting bad decisions inside a pipeline does not make them good: leaving Salary in the features is still leakage. A pipeline helps enforce a workflow; it does not decide whether the workflow makes sense. That is still your job. In the lesson’s words: “A pipeline doesn’t make my modeling decisions correct. It makes those decisions reproducible.”</p>`],
["","Takeaways and what comes next",String.raw`<p>A pipeline can combine missing-value handling, encoding, scaling, model training, cross-validation and tuning. The biggest advantage is not saving lines of code but a consistent, reproducible workflow that helps prevent preprocessing mistakes and leakage. The workflow is now: understand the data, split correctly, build the preprocessing pipeline, tune with cross-validation, evaluate on untouched test data. Next: how do you decide what the final model actually is, without tuning yourself into another problem?</p>`]],
27:[
["","The problem with comparing scores",String.raw`<p>Logistic Regression 0.81 AUC, Decision Tree 0.83, Random Forest 0.85, Gradient Boosting 0.86: it is tempting to declare the last one the winner. But where did the numbers come from? If you repeatedly tested models on the same test set, it stopped being truly “unseen” and you gradually started making decisions based on it. You need to separate choosing between models and settings from the final evaluation.</p>`],
["","Three jobs for the data",String.raw`<p>Training data is for learning. Choosing between models or settings is done with cross-validation on the training data. The final evaluation uses the test set, which stays out of the selection process entirely.</p>`],
["","Start fresh and make a promise",String.raw`<p>Reload the data, create <code>High_Salary</code>, split, and then promise: <b>I will not use <code>X_test</code> and <code>y_test</code> to choose my model</b>. The test set sits quietly until the very end. Reuse the preprocessing pipeline from Day 26.</p>`],
["","Cross-validate several models",String.raw`<p>Use five-fold cross-validation with <code>scoring="roc_auc"</code> on the logistic regression, random forest (<code>n_estimators=200</code>) and gradient boosting pipelines, under the same setup, and keep both <code>scores.mean()</code> and <code>scores.std()</code>. Put them in a results table.</p>`],
["","Why look at the standard deviation?",String.raw`<p>If scores are close across folds, performance looks stable; if they vary a lot, the mean alone does not tell you that. The standard deviation is not a magic measure of model quality, but it shows how much measured performance varies across folds, so report it with the mean.</p>`],
["key","Selection itself can overfit",String.raw`<p>Compare three models, then fifty configurations, and eventually something will look good on your cross-validation data just by chance. That does not mean cross-validation is bad; it means model selection is itself a process that can overfit to the data used for selection. Do not keep changing everything. That is why the final test set matters: one last check on truly held-out data.</p>`],
["ai","The rigorous version: nested cross-validation",String.raw`<p>To estimate how well a <i>whole selection procedure</i> works, you can wrap tuning inside an outer cross-validation loop (nested cross-validation). It is expensive and not used in this lesson, but it addresses exactly this concern. The Day 27 Coding Lab practices the simpler train, validation and test split.</p>`],
["","Tune inside the training data, then test once",String.raw`<p>Tune the random forest with <code>GridSearchCV(forest_pipeline, param_grid=forest_param_grid, scoring="roc_auc", ...)</code> and look at <code>best_params_</code> and <code>best_score_</code>, without touching the test set. Only then take <code>best_estimator_</code> and compute <code>final_test_auc</code> on the test set. Cross-validation asks which model looks best using training data; the test set asks how well the chosen model performs on data it never saw.</p>`],
["","Don’t panic if the scores differ",String.raw`<p>Mean CV AUC 0.86 and final test AUC 0.83: do not conclude something is wrong. The test set is another sample and estimates naturally vary. Worry about a very large, unexpected difference, which could indicate distribution differences, an unstable dataset or some other problem. The numbers need context.</p>`],
["","What does “reliable” mean?",String.raw`<p>It does not mean the model is perfect or will always work (that is unrealistic). It means the evaluation process is more trustworthy: a correct split, consistent preprocessing, cross-validation, reasonable model selection and an untouched final test.</p>`],
["","Repeated cross-validation",String.raw`<p>To investigate stability beyond one five-fold split, use <code>RepeatedStratifiedKFold</code> as the <code>cv</code> argument, which gives more validation scores across repeated splits and a broader view of variability. But more cross-validation is not automatically better: it costs computation, and with a small dataset no validation scheme can create information that is not there. There is no magic number; use a reasonable evaluation design for the problem.</p>`],
["","Choose the metric before looking at results",String.raw`<p><code>scoring="accuracy"</code>, <code>"recall"</code> and <code>"roc_auc"</code> ask different questions (see <a href="#day-18">Day 18</a>). Decide what “good performance” means for this problem first, otherwise the metric can choose the goal for you.</p>`],
["","The final modeling checklist",String.raw`<p>1 Define the prediction problem and what one row represents. 2 Define the target and make sure it is not a feature. 3 Split the data, create the test set, then leave it alone. 4 Build preprocessing without test-set information. 5 Choose the evaluation metric before comparing. 6 Cross-validate on training data. 7 Tune with <code>GridSearchCV</code> or another search. 8 Select the final model from the validation results. 9 Test once. 10 Report uncertainty and limitations: explain how the model was evaluated, not just one number.</p>`],
["","Takeaways and what comes next",String.raw`<p>Reliable modeling is about designing a trustworthy experiment: training data is for learning, cross-validation guides selection, tuning stays inside the training workflow, the test set stays untouched, the metric matches the goal, and performance varies across splits. A model’s score is only as meaningful as the process that produced it. The algorithm is only one part; the workflow around it matters just as much. The practical question left: how do you use the model tomorrow, on a completely new employee, without retraining?</p>`]],
28:[
["","What does “deploying a model” mean?",String.raw`<p>At a basic level: take a trained model and make it available for predictions on new data. Give it Education = Master’s and Job Title = Data Analyst, and it returns, say, “probability of high salary = 0.72”. This lesson is the first step toward that: saving a model and using it later.</p>`],
["key","Save the whole pipeline",String.raw`<p>A model is more than the algorithm. If you save only the classifier, you would still have to remember exactly how the training data was transformed, and preprocessing new data differently makes predictions meaningless. Build and train the final pipeline (preprocessing plus <code>LogisticRegression</code>) and it holds the numerical imputation values, scaling parameters, categorical encoding and model parameters: a trained prediction system.</p>`],
["","Evaluate first, then save",String.raw`<p>Evaluate on the test set one last time (precision, recall, F1, AUC), then save with <code>joblib.dump(pipeline, "salary_model.joblib")</code>. The file contains the whole pipeline: imputation, one-hot encoding and the logistic regression together.</p>`],
["","Load it again",String.raw`<p>Pretend you closed the notebook: <code>loaded_model = joblib.load("salary_model.joblib")</code> and no retraining is needed. Check that <code>loaded_model.predict(X_test)</code> gives the same predictions as the original pipeline.</p>`],
["ai","In the Coding Lab",String.raw`<p>The Day 28 Coding Lab does this save and reload in the browser. There the file lives in temporary in-memory storage and disappears when the page closes; on your own computer it would be a real file.</p>`],
["","Predict for a brand-new employee",String.raw`<p>Create a one-row DataFrame, <code>new_employee</code>, with the feature columns only. Do <b>not</b> include the target or Salary: you provide only the information that would be available when making the prediction. <code>loaded_model.predict(new_employee)</code> returns 1 (at least $100K) or 0; <code>loaded_model.predict_proba(new_employee)[:, 1]</code> gives the model’s probability.</p>`],
["key","Don’t misinterpret probability",String.raw`<p>A probability of 0.72 does not necessarily mean “72% of people like this earn at least $100K”. It is the output of the fitted model, and whether such outputs are well calibrated is a separate question. A more precise reading: “the model estimates 0.72 for the high-salary class”.</p>`],
["","Unseen categories and missing values",String.raw`<p>Tomorrow the Job Title may be “Quantum Data Strategist”, absent in training. Thanks to <code>handle_unknown="ignore"</code> the pipeline can still process it, though the model does not understand what the title means; it only knows how to handle an unseen category without crashing. A record with missing values is handled by the imputation strategies built into the pipeline: exactly why the whole workflow is saved together.</p>`],
["","A model file is not an application",String.raw`<p>You have not deployed anything to the internet yet; you have created a portable trained model. The model is like the brain; an application is the interface around it, where a user could enter Education and Job Title and the application sends them to the model.</p>`],
["key","Security note",String.raw`<p>Loading a serialized model file from an unknown or untrusted source can be dangerous. It is not like opening a harmless text file, so only load model files from sources you trust, especially when models are shared between computers or downloaded from the internet.</p>`],
["ai","Why",String.raw`<p><code>joblib</code> files are built on Python’s pickle mechanism, which can execute code when loaded. Files are also tied to library versions, which leads into versioning.</p>`],
["","Versioning and a model card",String.raw`<p>Six months later, if you changed the preprocessing, feature definitions, scikit-learn version or model settings, which model is that file? Use clearer names (<code>salary_model_v1.joblib</code>, <code>salary_model_v2.joblib</code>) and track the training data version. Write a small <b>model card</b>: what it predicts (Salary ≥ $100,000), its features (such as Years of Experience), the model (logistic regression), preprocessing (median imputation, most-frequent categorical imputation, one-hot encoding), the dataset, and limitations (an educational dataset; performance may not generalize to real-world salary populations).</p>`],
["","Takeaways and what comes next",String.raw`<p>A model is not finished just because it has a good score. A usable model needs a workflow around it: what data it expects, what preprocessing it uses, what it predicts, how it was evaluated, how to load it and make predictions, and what its limitations are. You can now train a pipeline, save it with joblib, load it, predict on new data, get probabilities, handle unseen categories and missing values, and document it. But a file is not user-friendly: next, a small web application where a person enters details, clicks a button and gets a prediction.</p>`]],
29:[
["","From a notebook to something someone can use",String.raw`<p>Handing a saved model to someone does not help if they must open Python and type <code>model.predict(new_employee)</code>. The goal: a small interface where a person enters years of experience, education and job title, clicks a button and gets a prediction. The tool for this is <b>Streamlit</b>.</p>`],
["","What Streamlit does",String.raw`<p>You write Python and Streamlit turns it into a web interface, so you do not need to start with HTML, CSS and JavaScript. The goal is not to become a web developer; it is to make the model usable. The app might show fields for Age, Years of Experience, Education (dropdown) and Job Title, then a prediction (“High Salary”) with a probability (such as 72%). The user does not need to know anything about one-hot encoding or logistic regression.</p>`],
["","Project structure",String.raw`<p>A folder containing <code>app.py</code> (the application), <code>salary_model.joblib</code> (the trained pipeline) and <code>requirements.txt</code>. Install with <code>pip install streamlit</code> and the libraries the model needs (<code>pandas scikit-learn joblib</code>). Import the libraries, then <code>model = joblib.load("salary_model.joblib")</code>. Remember that this file holds the whole pipeline (missing-value handling, one-hot encoding, logistic regression), so the app does not need to repeat any preprocessing.</p>`],
["","Building the interface",String.raw`<p>Streamlit functions display things (<code>st.title</code>) and create input widgets that the user controls: <code>st.number_input</code> for age and years of experience, <code>st.selectbox</code> for education (a dropdown, which also reduces spelling mistakes), and <code>st.text_input</code> for job title with a default such as “Data Analyst”. A dropdown of every possible job title would be impractical, and <code>handle_unknown="ignore"</code> means an unseen title will not crash the pipeline.</p>`],
["key","Give the model the structure it saw in training",String.raw`<p>Put the inputs into a DataFrame, <code>input_data = pd.DataFrame({...})</code>, with <i>exactly</i> the column names the model was trained on. The application has to give the model the same kind of input structure it saw during training.</p>`],
["","The Predict button and the result",String.raw`<p><code>if st.button("Predict"):</code> runs the prediction only when clicked: <code>model.predict(input_data)</code> and <code>model.predict_proba(input_data)[0, 1]</code>. Show the class (1 means high salary) and the probability, formatted like <code>f"{probability:.1%}"</code>. Run it from a terminal with <code>streamlit run app.py</code>; Streamlit starts a local web server and you open the app in your browser. That is the moment the project changes from looking at output to interacting with a working application.</p>`],
["ai","Why the model is cached in real apps",String.raw`<p>Streamlit reruns the whole script on every interaction, so <code>joblib.load</code> would repeat each time. Real apps usually load the model once with <code>st.cache_resource</code>. Streamlit needs a Python web server, so it cannot run in this page; the Day 29 Coding Lab runs the same logic as a plain function.</p>`],
["","What happens when someone clicks Predict",String.raw`<p>Suppose they enter Master’s and Data Analyst: the app builds a one-row DataFrame, the pipeline imputes, one-hot encodes and applies logistic regression, and returns a prediction. The user never sees those steps; the pipeline handles them.</p>`],
["key","Add a disclaimer",String.raw`<p>The app should not imply that the model determines someone’s actual salary. It predicts a category based on a particular dataset, and salary predictions can easily be misunderstood. Sections such as <code>st.header("Employee Information")</code> and <code>st.header("Prediction")</code> improve usability without changing the model: machine learning and application design are two different problems, and a model can be good while the application is confusing.</p>`],
["","Validate the inputs",String.raw`<p>Just because the app works does not mean users will enter sensible information: say, experience larger than age. The model might still accept it, so a real application should validate inputs. For example, <code>if experience > age:</code> show a warning. It does not delete the input; it warns the user. This connects to the data-cleaning lessons (<a href="#day-23">Day 23</a>): data quality does not stop when the model is deployed.</p>`],
["","Model versus application",String.raw`<p>The model handles input to prediction. The application takes input, validates it, sends it to the model, displays the result and explains the limitations. Keeping them separate helps: with new salary data next year, retrain the pipeline, save <code>salary_model_v2.joblib</code>, and the app can use the updated model without editing its prediction logic. A <code>requirements.txt</code> lets another person install the right packages with <code>pip install -r requirements.txt</code>, which makes the project reproducible. A README can explain the evaluation, how to run the app and the limitations.</p>`],
["","Is it production-ready?",String.raw`<p>No: this is a portfolio and learning application. A real production system might need authentication, error handling, model versioning, automated testing, data validation, infrastructure, model retraining, drift monitoring and privacy controls. That is fine; you are learning the fundamental workflow first.</p>`],
["","Takeaways and what comes next",String.raw`<p>Learned: what Streamlit is, loading a saved model, input widgets, turning user input into a DataFrame, sending it through the pipeline, displaying predictions and probabilities, why input validation matters, and how a model differs from an application. The most important part is still the pipeline, because the app does not need to know how to encode categories or impute missing values. Deployment is not a magical final step; it is making a trained model usable outside the training notebook. Next: build the whole project from the dataset again, without following a step-by-step tutorial.</p>`]],
30:[
["","The challenge",String.raw`<p>Until now each lesson taught one concept: model evaluation, gradient boosting, cross-validation, deployment. But understanding topics individually does not prove you can put everything together. So start again with the employee salary dataset and one question: <b>can I predict whether an employee’s salary is at least $100,000?</b> The target is 1 for at least $100K and 0 otherwise, and the final project should include exploration, a target, a pipeline, models, evaluation, interpretation, a saved model and a small app.</p>`],
["","Rule number one",String.raw`<p>You may use documentation, search for syntax, look up an error message, even use AI, but do not blindly copy an entire solution. If you forget the exact syntax of <code>ColumnTransformer</code>, look it up. What matters is whether you understand <i>why</i> you are using it.</p>`],
["","Step 1: load and ask questions",String.raw`<p>Do not immediately train a model. Ask: how many observations? Which variables, numerical or categorical? Missing values? Duplicates? Suspicious values? How is salary distributed? Use <code>df.duplicated().sum()</code>, <code>value_counts()</code> for education and <code>head(20)</code> of job titles. This is the data-quality thinking of <a href="#day-23">Day 23</a>.</p>`],
